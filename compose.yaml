services:
  pgvector:
    image: pgvector/pgvector:0.8.6-pg18
    environment:
      POSTGRES_DB: ${PGVECTOR_DB:-kbase}
      POSTGRES_USER: ${PGVECTOR_USER:-kbase}
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD:-kbase-dev-password}
    ports:
      - "${PGVECTOR_PORT:-5433}:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DB_URL: jdbc:postgresql://pgvector:5432/${PGVECTOR_DB:-kbase}
      DB_USERNAME: ${PGVECTOR_USER:-kbase}
      DB_PASSWORD: ${PGVECTOR_PASSWORD:-kbase-dev-password}
      JWT_SECRET: ${JWT_SECRET:-a2Jhc2UtbG9jYWwtZGV2ZWxvcG1lbnQtb25seS1qd3Qtc2VjcmV0LWtleS0yMDI2}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-3600}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-kbase-documents}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      DOCUMENT_MAX_FILE_SIZE_BYTES: ${DOCUMENT_MAX_FILE_SIZE_BYTES:-52428800}
      PROFILE_AVATAR_MAX_FILE_SIZE_BYTES: ${PROFILE_AVATAR_MAX_FILE_SIZE_BYTES:-2097152}
      CHAT_MAX_MESSAGE_CHARS: ${CHAT_MAX_MESSAGE_CHARS:-4000}
      CHAT_RATE_LIMIT_REQUESTS: ${CHAT_RATE_LIMIT_REQUESTS:-10}
      CHAT_RATE_LIMIT_WINDOW_SECONDS: ${CHAT_RATE_LIMIT_WINDOW_SECONDS:-60}
      RAG_CHUNK_SIZE: ${RAG_CHUNK_SIZE:-800}
      RAG_CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP:-100}
      RAG_TOP_K: ${RAG_TOP_K:-5}
      RAG_MAX_HISTORY_MESSAGES: ${RAG_MAX_HISTORY_MESSAGES:-10}
      RAG_MAX_CONTEXT_CHUNKS: ${RAG_MAX_CONTEXT_CHUNKS:-10}
      RAG_MAX_CONTEXT_CHARS: ${RAG_MAX_CONTEXT_CHARS:-20000}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-dev}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://host.docker.internal:11434/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-kbase-dev-hash-v1}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-128}
      LLM_PROVIDER: ${LLM_PROVIDER:-dev}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-kbase-dev-context-v1}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.1}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-800}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
    ports:
      - "8080:8080"
    depends_on:
      pgvector:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  pgvector-data:
  minio-data:
