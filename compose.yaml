services:
  pgvector:
    image: pgvector/pgvector:0.8.6-pg18
    environment:
      POSTGRES_DB: ${PGVECTOR_DB:-kbase}
      POSTGRES_USER: ${PGVECTOR_USER:-kbase}
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD:-kbase-dev-password}
    ports:
      - "${PGVECTOR_PORT:-5433}:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  pgvector-data:
  minio-data:
