spring.application.name=KBase

# PostgreSQL datasource
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/kbase}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.baseline-on-migrate=true

# JWT (Base64-encoded key containing at least 256 bits)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# MinIO / S3-compatible object storage
app.storage.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
app.storage.access-key=${MINIO_ACCESS_KEY}
app.storage.secret-key=${MINIO_SECRET_KEY}
app.storage.bucket=${MINIO_BUCKET:kbase-documents}
app.storage.max-file-size=${MAX_UPLOAD_SIZE:52428800}

# Keep the servlet limit aligned with the application-level 50 MiB default.
spring.servlet.multipart.max-file-size=${MAX_MULTIPART_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${MAX_MULTIPART_REQUEST_SIZE:51MB}
