spring.application.name=KBase

# PostgreSQL datasource
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/kbase}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.baseline-on-migrate=true

# JWT (Base64-encoded key containing at least 256 bits)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:${JWT_EXPIRATION_SECONDS:3600}000}
app.google.client-id=${GOOGLE_CLIENT_ID:}

# OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator exposes only safe liveness information; component details are not public.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.health.db.enabled=true

# MinIO / S3-compatible object storage
app.storage.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
app.storage.access-key=${MINIO_ACCESS_KEY}
app.storage.secret-key=${MINIO_SECRET_KEY}
app.storage.bucket=${MINIO_BUCKET:kbase-documents}
app.storage.max-file-size=${DOCUMENT_MAX_FILE_SIZE_BYTES:${MAX_UPLOAD_SIZE:52428800}}
app.profile.avatar-max-file-size=${PROFILE_AVATAR_MAX_FILE_SIZE_BYTES:2097152}

# Keep the servlet limit aligned with the application-level 50 MiB default.
spring.servlet.multipart.max-file-size=${MAX_MULTIPART_FILE_SIZE:${DOCUMENT_MAX_FILE_SIZE_BYTES:52428800}B}
spring.servlet.multipart.max-request-size=${MAX_MULTIPART_REQUEST_SIZE:${DOCUMENT_MAX_FILE_SIZE_BYTES:52428800}B}

# Browser integration. Use a comma-separated explicit allowlist; wildcards are rejected.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# In-memory per-authenticated-user chat protection (single backend instance only).
app.chat.max-message-chars=${CHAT_MAX_MESSAGE_CHARS:4000}
app.chat.rate-limit-requests=${CHAT_RATE_LIMIT_REQUESTS:10}
app.chat.rate-limit-window-seconds=${CHAT_RATE_LIMIT_WINDOW_SECONDS:60}

logging.pattern.level=%5p [requestId:%X{requestId:-none}]

# RAG chunking uses an approximate token count of four characters per token.
app.rag.chunk-size=${RAG_CHUNK_SIZE:800}
app.rag.chunk-overlap=${RAG_CHUNK_OVERLAP:100}
app.rag.top-k=${RAG_TOP_K:5}
app.rag.max-history-messages=${RAG_MAX_HISTORY_MESSAGES:10}
app.rag.max-context-chunks=${RAG_MAX_CONTEXT_CHUNKS:10}
app.rag.max-context-chars=${RAG_MAX_CONTEXT_CHARS:20000}

# Embeddings. The default deterministic provider is for development/testing only.
app.embedding.provider=${EMBEDDING_PROVIDER:dev}
app.embedding.base-url=${EMBEDDING_BASE_URL:http://localhost:11434/v1}
app.embedding.api-key=${EMBEDDING_API_KEY:}
app.embedding.model=${EMBEDDING_MODEL:kbase-dev-hash-v1}
app.embedding.dimension=${EMBEDDING_DIMENSION:128}

# Chat generation. DEV is deterministic and local; use openai-compatible in production.
app.llm.provider=${LLM_PROVIDER:dev}
app.llm.base-url=${LLM_BASE_URL:http://localhost:11434/v1}
app.llm.api-key=${LLM_API_KEY:}
app.llm.model=${LLM_MODEL:kbase-dev-context-v1}
app.llm.temperature=${LLM_TEMPERATURE:0.1}
app.llm.max-output-tokens=${LLM_MAX_OUTPUT_TOKENS:800}
app.llm.timeout-seconds=${LLM_TIMEOUT_SECONDS:60}
